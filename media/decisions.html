<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Proof — decisions for Jade</title>
<style>
  :root { --paper:#f6f1e6; --ink:#2b2824; --mute:#6f675c; --gold:#b48a2c; --line:#d9cfbd; --done:#5a7a4a; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--paper); color:var(--ink); font:16px/1.5 Georgia, "Iowan Old Style", serif; }
  header { position:sticky; top:0; z-index:5; background:rgba(246,241,230,.96); border-bottom:1px solid var(--line); padding:12px 28px; display:flex; gap:18px; align-items:center; flex-wrap:wrap; }
  header h1 { font-size:20px; margin:0; font-weight:normal; letter-spacing:.02em; }
  header .count { color:var(--mute); font-size:14px; }
  header nav a { color:var(--ink); margin-right:12px; font-size:14px; text-decoration:none; border-bottom:1px dotted var(--mute); }
  header button { margin-left:auto; }
  button { font:inherit; font-size:14px; padding:6px 14px; border:1px solid var(--ink); background:#fffaf0; cursor:pointer; border-radius:3px; }
  button.primary { background:var(--ink); color:var(--paper); }
  main { max-width:1180px; margin:0 auto; padding:10px 28px 80px; }
  h2 { font-weight:normal; font-size:24px; margin:40px 0 6px; border-bottom:1px solid var(--line); padding-bottom:4px; }
  h2 small { color:var(--mute); font-size:14px; margin-left:8px; }
  .card { background:#fffdf7; border:1px solid var(--line); border-left:4px solid var(--gold); margin:16px 0; padding:16px 20px; border-radius:3px; }
  .card.answered { border-left-color:var(--done); }
  .card h3 { margin:0 0 6px; font-size:18px; display:flex; gap:10px; align-items:baseline; flex-wrap:wrap; }
  .card h3 .t { color:var(--gold); font-size:15px; font-family:ui-monospace, Menlo, monospace; }
  .card h3 .set { color:var(--mute); font-size:13px; font-weight:normal; }
  .card .ctx { color:var(--mute); font-size:15px; margin:0 0 10px; }
  .imgs { display:flex; gap:10px; flex-wrap:wrap; margin:8px 0 12px; }
  .imgs figure { margin:0; flex:1 1 300px; max-width:560px; }
  .imgs img { width:100%; border:1px solid var(--line); cursor:zoom-in; background:#ddd; }
  .imgs figcaption, .auds figcaption { font-size:13px; color:var(--mute); }
  .imgs .missing { padding:30px; border:1px dashed var(--line); color:var(--mute); font-size:13px; text-align:center; }
  .auds { display:flex; gap:14px; flex-wrap:wrap; margin:8px 0 12px; }
  .auds figure { margin:0; flex:0 1 330px; }
  .auds audio { width:100%; }
  .opts label { display:block; padding:3px 0; cursor:pointer; }
  .opts .rec { color:var(--gold); font-size:13px; margin-left:6px; }
  textarea { width:100%; min-height:44px; font:inherit; font-size:14px; padding:6px 8px; border:1px solid var(--line); background:#fff; margin-top:6px; }
  #zoom { position:fixed; inset:0; background:rgba(20,18,15,.92); display:none; align-items:center; justify-content:center; z-index:10; cursor:zoom-out; }
  #zoom img { max-width:96vw; max-height:94vh; }
  #out { position:fixed; inset:5vh 10vw; background:#fffdf7; border:1px solid var(--ink); z-index:11; display:none; padding:16px; flex-direction:column; gap:8px; }
  #out textarea { flex:1; font-family:ui-monospace, Menlo, monospace; font-size:13px; }
  .note { color:var(--mute); font-size:14px; }
  details.done { margin-top:50px; border-top:1px solid var(--line); padding-top:10px; color:var(--mute); font-size:14px; }
  details.done summary { cursor:pointer; font-size:16px; color:var(--ink); }
  details.done h4 { margin:12px 0 2px; font-weight:normal; color:var(--ink); }
  details.done ul { margin:0; padding-left:20px; }
</style>
</head>
<body>
<header>
  <h1>Proof — decisions for Jade</h1>
  <span class="count" id="count"></span>
  <nav id="nav"></nav>
  <button class="primary" onclick="exportAnswers()">Copy my answers</button>
</header>
<main>
  <p class="note">Round 7, 2026-11-27: open questions only. Choose an option or write a note on each card, then press "Copy my answers" and paste the result into the chat.</p>
  <div id="cards"></div>
  <details class="done" id="done"></details>
</main>
<div id="zoom" onclick="this.style.display='none'"><img alt=""></div>
<div id="out"><b>Paste this into the chat:</b><textarea id="outText" readonly></textarea><div><button class="primary" onclick="copyOut()">Copy to clipboard</button> <button onclick="document.getElementById('out').style.display='none'">Close</button> <span id="copied" class="note"></span></div></div>

<script>
// Cards: { sec, id, t?, title, ctx, imgs?, audio?, vids?, opts, rec }. t = the song time (-2sm master, "m:ss.s" or
// "m:ss.s-m:ss.s") of the shot the card is about: look it up with `python3 tools/pages/songfollow.py time <SHOT>`.
// Cards with t are shown in song order under the song's sections and are followed by the player bar
// (tools/pages/songfollow.js, the block at the end of the page); cards without t go to the end, grouped by sec.
// Image paths are relative to this file (media/). L = layout renders, ART = canonical background-art images, A = audio excerpts of inputs/Proof (-2sm).wav. vids = video clips.
const L = (p) => 'layout/' + p;
const A = (p) => 'decisions_audio/' + p;
const ART = (p) => '../layout/assets/art/' + p;
const D = [
 { sec:"Shanghai 1986", id:"sh_v1b_cam", t:"0:31.6-0:34.5", title:"V1b camera: 22° or 34°?",
   ctx:"34° shows the uncle's watch face better but reframes the shot. You said it depends on which angle keeps the hands accurate.",
   imgs:[[L("_sheets/canon/shanghai86_V1b_22_vs_34.jpg"),"22° (now) vs 34°, every guide mode"]],
   opts:["Test-paint both (2 takes each), then I pick","Keep 22°","Switch to 34°","Something else (below)"], rec:0 },
 { sec:"Shanghai 1986", id:"sh_v1a_watch", t:"0:29.7-0:31.6", title:"V1a: the watch strap on his bent wrist",
   ctx:"With his hand bent back, the strap reads as a loop sticking off the back of his hand. The engine has no skin under the sleeve, so the watch can't move higher up the arm.",
   imgs:[[L("shanghai86/V1a_lit.png"),"V1a guide"]],
   opts:["Tell the painter: the watch sits half under the cuff","Leave the watch out of V1a","Something else (below)"], rec:0 },
 { sec:"Our house 2010 (mv10)", id:"mv_k0", t:"3:14.6", title:"V3_rcv_obl_k0: she keeps swapping with the guest",
   ctx:"In the model she has her back to the camera. Every take moves her to the guest's spot so her face shows, even with the guest restyled (tall, dark blond, mustard and khaki).",
   imgs:[[L("mv10/V3_rcv_obl_k0_lit.png"),"guide"],["keyframes/r4/mv10/V3_rcv_obl_k0_v5.jpg","v5 (swapped)"],["keyframes/r4/mv10/V3_rcv_obl_k0_v1.jpg","v1 (current pick)"]],
   opts:["Restage her so she faces the camera from the far side","Try a layered paint-back with the current staging","Keep v1","Something else (below)"], rec:0 },
 { sec:"Wall 1988", id:"wl_eye", t:"1:40.7-1:45.5", title:"WL_eye: keep v1?",
   ctx:"The repaint agent kept v1: the new v3 looks the wrong way and v4 makes her eyes look older.",
   imgs:[["keyframes/r4/wall88/WL_eye_v1.jpg","v1 (pick)"],["keyframes/r4/wall88/WL_eye_v3.jpg","v3"],["keyframes/r4/wall88/WL_eye_v4.jpg","v4"]],
   opts:["Keep v1","Repaint after the new brows and glasses, with v1 as the expression reference","Something else (below)"], rec:0 },
 { sec:"Office 1991", id:"off_cabinet", t:"1:17.2-1:21.5", title:"Classroom: the new low grey cabinet and honey-oak chairs",
   ctx:"To lock the background, the wall art now matches PC1 v1. The 'grey cabinet' you liked in v1/v2 was really Mom's chair back, so a low two-drawer grey file cabinet was added there. The chairs are now honey oak, as in the paintings (this changes them in every office shot). The camera is unchanged.",
   imgs:[[L("office91/PC1_lit.png"),"PC1 guide"],[L("office91/PC2_lit.png"),"PC2 guide"],["keyframes/r4/office91/PC1_v1.jpg","PC1 v1 (the take you liked)"]],
   opts:["Good","Remove the invented cabinet","Something else (below)"], rec:0 },
 { sec:"Closet 2002", id:"cl_hold", t:"3:28.0-3:29.4", title:"Put the approved hold into CL_hands and CL_ots now?",
   ctx:"Their guides still show the old cradle hold, not the hold you approved (her hand across his, fingers folding into a clasp, his other hand covering both). Before that, two guide errors need fixing: a clip in the crossed-legs D2 guide and a thorn-shaped thumb in H1. Then the hands sheet and the hands library get the same hold.",
   opts:["Yes, start now","Later","Something else (below)"], rec:0 },
 { sec:"Song timing", id:"song_times", title:"Four shots whose times disagree with their titles",
   ctx:"BR2 and BR3 use 2:37.1 and 2:38.1, but their titles say 2:34.5 and 2:37.1. PG2 starts at 4:21.7, but its title says 4:24.1. AD_keys is at 0:13.2, but its title says 0:05.",
   opts:["Use the times in the titles","Keep the times in use now","I'll check them on the r4 page (below)"], rec:2 },
 { sec:"Workflow", id:"claude_md_frame", title:"Add the framing rule to your global CLAUDE.md?",
   ctx:"One more bullet in its video section, so the rule applies in every project: \"The guide's frame is the final frame: anything outside it gets invented.\"",
   opts:["Add it","Don't"], rec:0 },
];

// What was taken in from earlier rounds (shown collapsed at the bottom; not part of the copy-out).
const DONE_DATE = "";
const DONE = [
];

const KEY = 'proof-decisions-v8';
const state = JSON.parse(localStorage.getItem(KEY) || '{}');
const save = () => { localStorage.setItem(KEY, JSON.stringify(state)); count(); };
const esc = (s) => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const songT = (v) => { const m = String(v ?? '').match(/^~?(\d+):(\d+(?:\.\d+)?)/); return m ? +m[1] * 60 + +m[2] : null; };
const fmtT = (x) => `${Math.floor(x / 60)}:${(x % 60).toFixed(1).padStart(4, '0')}`;
function order() {
  // timed cards in song order under the song's sections (from tools/pages/song_m2sm.js); untimed ones after, by topic
  const timed = D.filter(d => songT(d.t) != null), untimed = D.filter(d => songT(d.t) == null);
  if (!timed.length) return D.map(d => [d, d.sec, '', '']);
  const S = (window.SONG_M2SM || {}).sections || [];
  const secOf = (t) => { let x = null; for (const s of S) if (s.t <= t + 1e-6) x = s; return x; };
  timed.sort((a, b) => songT(a.t) - songT(b.t));
  return timed.map(d => { const x = secOf(songT(d.t)); return [d, x ? x.short : 'Song', x ? `${fmtT(x.t)}-${fmtT(x.end)}` : '', d.sec]; })
    .concat(untimed.map(d => [d, 'No song time · ' + d.sec, '', '']));
}
function render() {
  const root = document.getElementById('cards'); const secs = [];
  let cur = null;
  for (const [d, sec, secTime, topic] of order()) {
    if (sec !== cur) { cur = sec; secs.push(cur); const h = document.createElement('h2'); h.id = 'sec-' + secs.length; h.innerHTML = esc(cur) + (secTime ? `<small>${esc(secTime)}</small>` : ''); root.appendChild(h); }
    const s = state[d.id] || {};
    const c = document.createElement('div'); c.className = 'card'; c.id = d.id;
    if (songT(d.t) != null) c.dataset.t = d.t;
    let h = `<h3>${songT(d.t) != null ? `<span class="t">${esc(d.t)}</span> ` : ''}${esc(d.title)}${topic ? `<span class="set">${esc(topic)}</span>` : ''}</h3>`;
    if (d.ctx) h += `<p class="ctx">${esc(d.ctx)}</p>`;
    if (d.imgs) h += '<div class="imgs">' + d.imgs.map(([src, cap]) => `<figure><img src="${esc(src)}" loading="lazy" alt="${esc(cap)}" onerror="this.outerHTML='<div class=missing>not rendered yet: ${esc(src)}</div>'"><figcaption>${esc(cap)}</figcaption></figure>`).join('') + '</div>';
    if (d.audio) h += '<div class="auds">' + d.audio.map(([src, cap]) => `<figure><audio controls preload="none" src="${esc(src)}"></audio><figcaption>${esc(cap)}</figcaption></figure>`).join('') + '</div>';
    if (d.vids) h += '<div class="auds">' + d.vids.map(([src, cap]) => `<figure style="flex:1 1 420px;max-width:560px"><video controls preload="metadata" src="${esc(src)}" style="width:100%"></video><figcaption>${esc(cap)}</figcaption></figure>`).join('') + '</div>';
    h += '<div class="opts">' + d.opts.map((o, i) => `<label><input type="radio" name="${d.id}" value="${i}" ${s.choice == i ? 'checked' : ''}> ${esc(o)}${i === d.rec ? '<span class="rec">current / suggested</span>' : ''}</label>`).join('') + '</div>';
    h += `<textarea placeholder="Notes or corrections (optional)" data-id="${d.id}">${esc(s.note || '')}</textarea>`;
    c.innerHTML = h; root.appendChild(c);
  }
  document.getElementById('nav').innerHTML = secs.map((s, i) => `<a href="#sec-${i + 1}">${esc(s.replace(/^No song time · /, ''))}</a>`).join('') + '<a href="#done">Answered</a>';
  if (!DONE.length) document.getElementById('done').remove(); else document.getElementById('done').innerHTML = `<summary>Answered ${esc(DONE_DATE)}: what was taken in</summary>` + DONE.map(([sec, lines]) => `<h4>${esc(sec)}</h4><ul>${lines.map(l => `<li>${esc(l)}</li>`).join('')}</ul>`).join('');
  root.addEventListener('change', (e) => { if (e.target.type === 'radio') { (state[e.target.name] ||= {}).choice = +e.target.value; save(); mark(); } });
  root.addEventListener('input', (e) => { if (e.target.tagName === 'TEXTAREA') { (state[e.target.dataset.id] ||= {}).note = e.target.value; save(); mark(); } });
  root.addEventListener('click', (e) => { if (e.target.tagName === 'IMG') { const z = document.getElementById('zoom'); z.querySelector('img').src = e.target.src; z.style.display = 'flex'; } });
  mark(); count();
}
const answered = (id) => { const s = state[id]; return s && (s.choice !== undefined || (s.note || '').trim()); };
function mark() { for (const d of D) document.getElementById(d.id).classList.toggle('answered', !!answered(d.id)); }
function count() { document.getElementById('count').textContent = `${D.filter(d => answered(d.id)).length} of ${D.length} answered`; }
function exportAnswers() {
  const lines = ['Decisions (from media/decisions.html):'];
  let cur = null;
  for (const d of D) {
    if (!answered(d.id)) continue;
    if (d.sec !== cur) { cur = d.sec; lines.push('', '## ' + cur); }
    const s = state[d.id];
    lines.push(`- ${d.title}: ${s.choice !== undefined ? d.opts[s.choice] : '(no option picked)'}${(s.note || '').trim() ? ' — ' + s.note.trim().replace(/\n+/g, ' / ') : ''}`);
  }
  if (lines.length === 1) lines.push('(nothing answered yet)');
  document.getElementById('outText').value = lines.join('\n');
  document.getElementById('out').style.display = 'flex'; document.getElementById('copied').textContent = '';
}
function copyOut() { const t = document.getElementById('outText'); t.select(); navigator.clipboard?.writeText(t.value).then(() => document.getElementById('copied').textContent = 'Copied.', () => { document.execCommand('copy'); document.getElementById('copied').textContent = 'Copied.'; }); }
document.addEventListener('DOMContentLoaded', render);   // after tools/pages/song_m2sm.js (end of the page) has loaded
</script>
<!-- songfollow:begin -->
<link rel="stylesheet" href="../tools/pages/songfollow.css">
<script src="../tools/pages/song_m2sm.js"></script>
<script src="../tools/pages/songfollow.js"></script>
<script>SongFollow.init({"audio": "../inputs/Proof%20%28-2sm%29.mp3", "cards": ".card", "timeLabel": ".t", "groupUntimed": false});</script>
<!-- songfollow:end -->
</body>
</html>
